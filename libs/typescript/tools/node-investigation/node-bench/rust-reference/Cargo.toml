[package]
name = "xray-node-bench-reference"
version = "0.0.0"
edition = "2021"
publish = false

# Benchmark-only reference. Not a dependency of any published XRAY package.
[dependencies]
blake2 = "=0.10.6"
ed25519-dalek = "=2.2.0"
hex = "=0.4.3"
k256 = { version = "=0.13.4", features = ["ecdsa", "schnorr"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sha3 = "=0.10.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = false
